[package]
name = "hours-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native desktop reader for the Liturgy of the Hours"
license = "MIT"
repository = "https://github.com/chrisvo/hours-rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
wgpu = { version = "30", default-features = false, features = ["metal", "vulkan", "gles", "wgsl"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies"] }
scraper = "0.27"
ego-tree = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 1
