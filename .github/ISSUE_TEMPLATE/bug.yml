name: Bug report
description: Report something that does not work as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach your personal library or backup. Report security vulnerabilities privately through the Security tab."
  - type: input
    id: version
    attributes:
      label: Hours version
      placeholder: "0.1.0, or a commit hash"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and processor
      placeholder: "macOS 26, Apple M2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the date and office if the problem concerns a prayer or download.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the error message or a screenshot without personal notes.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Additional details
      description: Redact private paths and other personal information from logs.
